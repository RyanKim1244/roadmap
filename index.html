<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Research Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, well-edited study guide; content and whitespace, no ornament
   IDEA: a typeset course syllabus — numbered parts divided by hairlines
   PICTURE: a single thin route line; only the current stop carries colour
   COLOUR and TYPE: white and ink, one blue accent / Inter + Noto Sans KR
   LAYOUT: narrow reading column, sections split by hairlines, stages collapsible */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1012);--bg2:light-dark(#fafafa,#141518);
--ink:light-dark(#141414,#ececec);--mute:light-dark(#6b6b6b,#9b9ea4);
--line:light-dark(#e7e7e7,#26282c);--acc:light-dark(#2f54eb,#8da2ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Inter","Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--acc);color:var(--acc)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.band{padding:clamp(40px,6vw,88px) max(5vw,20px)}
.wrap{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.brand{font-size:14px;color:var(--mute)}
.lang{display:flex;flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{min-height:36px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:14px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
h1{font-weight:600;font-size:clamp(32px,4.6vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font-weight:600;font-size:clamp(22px,2.6vw,28px);line-height:1.2;letter-spacing:-.01em;margin:0 0 10px}
h3{font-size:17px;margin:0 0 4px;font-weight:600;line-height:1.4}
h4{font-size:14px;font-weight:600;margin:22px 0 6px}
.lede{color:var(--mute);max-width:64ch;margin:0}
.meta{color:var(--mute);font-size:14px;margin-top:14px}
.fig{position:relative;min-height:96px;margin-top:36px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
nav.scroll{display:flex;gap:28px;overflow-x:auto;padding:0 max(5vw,20px);border-block:1px solid var(--line);background:var(--bg)}
nav.scroll a{flex:none;padding:14px 0;text-decoration:none;color:var(--mute);font-size:15px}
nav.scroll a:hover{color:var(--ink)}
@media(min-width:900px){nav.scroll{position:sticky;top:0;z-index:5;justify-content:center}}
html{scroll-padding-top:64px}
.alt{background:var(--bg2)}
section+section,footer{border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:0 40px;margin-top:28px}
.card{padding:20px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.tag{font-size:13px;color:var(--mute);white-space:nowrap}
.tag+.tag::before{content:"·";margin:0 6px}
.tag.p{color:var(--acc)}
.card p{margin:0;font-size:15px;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:20px;margin-top:24px;font-size:15px;color:var(--mute)}
.howto b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;margin-top:24px}
.bar{height:2px;background:var(--line);width:min(320px,100%)}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s ease}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
details.stage{border-top:1px solid var(--line)}
details.stage:last-of-type{border-bottom:1px solid var(--line)}
details.stage>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:20px;align-items:baseline;padding:26px 0}
details.stage>summary::-webkit-details-marker{display:none}
.num{font-size:28px;font-weight:300;line-height:1;color:var(--mute);font-variant-numeric:tabular-nums}
details.stage.done .num{color:var(--acc)}
.sumtxt h3{font-size:19px}
.sumtxt p{margin:0;color:var(--mute);font-size:15px}
.cnt{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt::after{content:"＋";margin-left:10px}
details[open] .cnt::after{content:"－"}
.body{padding:0 0 36px 76px}
.facts{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:14px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:600;margin-right:6px}
.why{margin:14px 0 0;max-width:66ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
ul.items input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:4px 0 0;border:1.5px solid var(--mute);border-radius:4px;flex:none;cursor:pointer;display:grid;place-items:center;background:transparent}
ul.items input:checked{background:var(--acc);border-color:var(--acc)}
ul.items input:checked::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
ul.items .it{flex:1}
ul.items .sub{display:block;font-size:13px;color:var(--mute);margin-top:1px}
ul.items .d{display:block;font-size:14px;color:var(--mute);margin-top:2px}
ul.items .hrs{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:3px}
li.chk .it>a{color:var(--mute);text-decoration:line-through}
.box{margin-top:18px;font-size:15px;color:var(--mute);max-width:70ch}
.box b{display:block;color:var(--ink);font-weight:600;font-size:14px;margin-bottom:2px}
.box ul{margin:4px 0 0;padding-left:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0 36px}
.tracks{border-top:1px solid var(--line);margin-top:6px}
details.track{border-bottom:1px solid var(--line)}
details.track>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:16px 0}
details.track>summary::-webkit-details-marker{display:none}
.tid{font-weight:600;color:var(--mute)}details.track.done .tid{color:var(--acc)}
details.track .sumtxt h3{font-size:16px}
.tbody{padding:0 0 22px 42px}
details.arch{margin-top:28px;border-top:1px solid var(--line)}
details.arch>summary{cursor:pointer;padding:14px 0;color:var(--mute);min-height:44px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px;margin-top:24px}
ol.steps{margin:8px 0 0;padding-left:20px;color:var(--mute)}ol.steps li{margin:8px 0}
ul.src{list-style:none;margin:8px 0 0;padding:0}ul.src li{padding:8px 0;border-top:1px solid var(--line)}ul.src li:first-child{border-top:0}
ul.src .d{display:block;font-size:14px;color:var(--mute)}
button{font:inherit;font-size:14px;min-height:44px;padding:0;border:0;background:none;color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
button:hover{color:var(--ink)}
footer{color:var(--mute);font-size:14px}
@media(max-width:600px){details.stage>summary{grid-template-columns:36px minmax(0,1fr);gap:12px}.cnt{grid-column:2}.num{font-size:22px}.body{padding-left:0}.tbody{padding-left:0}details.track>summary{grid-template-columns:22px minmax(0,1fr)}details.track .cnt{grid-column:2}.fig{min-height:400px}nav.scroll{gap:20px}ul.items li{flex-wrap:wrap}ul.items .hrs{width:100%;padding:0 0 0 32px;margin-top:-8px}}

/* motion */
:root{interpolate-size:allow-keywords}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.grid.reveal .card{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.grid.reveal.in .card{opacity:1;transform:none}
.grid.reveal.in .card:nth-child(2){transition-delay:.06s}.grid.reveal.in .card:nth-child(3){transition-delay:.12s}.grid.reveal.in .card:nth-child(4){transition-delay:.18s}.grid.reveal.in .card:nth-child(5){transition-delay:.24s}.grid.reveal.in .card:nth-child(6){transition-delay:.3s}.grid.reveal.in .card:nth-child(n+7){transition-delay:.36s}
details.stage::details-content,details.track::details-content{block-size:0;overflow:hidden;transition:block-size .4s cubic-bezier(.2,.7,.2,1),content-visibility .4s allow-discrete}
details.stage[open]::details-content,details.track[open]::details-content{block-size:auto}
details>summary{transition:color .2s}
details.stage>summary:hover .sumtxt h3,details.track>summary:hover .sumtxt h3{color:var(--acc)}
.cnt::after{display:inline-block;transition:transform .3s ease}
ul.items input{transition:background-color .2s,border-color .2s,transform .15s}
ul.items input:active{transform:scale(.88)}
li .it>a{transition:color .25s,text-decoration-color .25s}
.lang button{transition:background-color .25s,color .25s}
main,.swap{transition:opacity .18s ease}
body.switching .wrap{opacity:.25;transition:opacity .12s ease}
.wrap{transition:opacity .25s ease}
#map .route{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s cubic-bezier(.4,0,.2,1) .15s forwards}
#map .stop{opacity:0;animation:pop .45s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#map .stop{transform-box:fill-box;transform-origin:center}
.hours{margin-top:24px}.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:20px;margin-top:10px}
.hgrid b{display:block;font-size:clamp(26px,3.4vw,34px);font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hgrid span{color:var(--mute);font-size:14px}
ul.plain{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:15px}ul.plain li{margin:8px 0}
@media(prefers-reduced-motion:reduce){.reveal,.grid.reveal .card{opacity:1;transform:none;transition:none}details::details-content{transition:none}#map .route,#map .stop{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:1}.wrap,body.switching .wrap{transition:none;opacity:1}}
.fields{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}.fields::-webkit-scrollbar{display:none}.fields button{flex:none}
@media(max-width:600px){.top{flex-direction:column-reverse;align-items:stretch;gap:10px}.lang{align-self:flex-end}}
.fields button{min-height:36px;padding:0 12px;border-radius:999px;text-decoration:none;font-size:14px;color:var(--mute);border:1px solid transparent;transition:color .2s,border-color .2s,background-color .2s}
.fields button:hover{color:var(--ink)}
.fields button[aria-selected=true]{color:var(--ink);border-color:var(--line);background:var(--bg2)}
ol.paths{list-style:none;margin:24px 0 0;padding:0}
ol.paths li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;padding:18px 0;border-top:1px solid var(--line)}
ol.paths li:first-child{border-top:0}
ol.paths .when{font-size:13px;color:var(--acc);padding-top:3px}
ol.paths h3 a{text-decoration:none}ol.paths h3 a:hover{text-decoration:underline}
ol.paths p{margin:4px 0 0;color:var(--mute);font-size:15px;max-width:70ch}
ol.paths .note{font-size:13px}
@media(max-width:600px){ol.paths li{grid-template-columns:minmax(0,1fr);gap:4px}}
</style>
</head>
<body>

<header class="band" style="padding-bottom:clamp(24px,3vw,48px)">
 <div class="wrap">
  <div class="top"><div class="fields" role="tablist" aria-label="Field" id="fieldtabs"></div>
   <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ko">한국어</button></div>
  </div>
  <h1 id="title"></h1>
  <p class="lede reveal" id="lede"></p>
  <p class="meta" id="upd"></p>
  <p class="meta" id="status" style="color:var(--acc)"></p>
  <div class="fig"><svg id="map" role="img"></svg></div>
 </div>
</header>

<nav class="scroll" aria-label="Sections">
 <a href="#frontier" data-t="navF"></a>
 <a href="#curriculum" data-t="navC"></a>
 <a href="#coverage" data-t="navR"></a>
 <a href="#pathways" data-t="navP"></a>
 <a href="#habits" data-t="navH"></a>
 <a href="#expand" data-t="navE"></a>
</nav>

<section class="band alt" id="frontier">
 <div class="wrap">
  <h2 class="reveal" data-t="fTitle"></h2>
  <p class="lede" id="fnote"></p>
  <div class="grid reveal" id="fgrid"></div>
  <details class="arch" id="farch"><summary data-t="archive"></summary><div id="fold"></div></details>
 </div>
</section>

<section class="band" id="curriculum">
 <div class="wrap">
  <h2 class="reveal" data-t="cTitle"></h2>
  <p class="lede" data-t="cLede"></p>
  <div class="howto reveal">
   <div><b data-t="h1t"></b><span data-t="h1d"></span></div>
   <div><b data-t="h2t"></b><span data-t="h2d"></span></div>
   <div><b data-t="h3t"></b><span data-t="h3d"></span></div>
  </div>
  <div class="ctrl">
   <div class="bar" aria-hidden="true"><i id="pbar"></i></div>
   <span class="meta" style="margin:0" id="ptext"></span>
   <button type="button" id="expand-all" data-t="expandAll"></button>
   <button type="button" id="share" data-t="share"></button>
   <button type="button" id="reset" data-t="reset"></button>
   <span class="meta" style="margin:0" id="sharemsg" aria-live="polite"></span>
  </div>
  <div id="stages" class="reveal" style="margin-top:20px"></div>
 </div>
</section>

<section class="band" id="coverage" style="border-top:1px solid var(--line)">
 <div class="wrap">
  <h2 class="reveal" data-t="covTitle"></h2>
  <p class="lede" data-t="covLede"></p>
  <div class="hours reveal" id="hours"></div>
  <div class="cols reveal">
   <div><h3 data-t="covYesT"></h3><ul class="plain" id="covYes"></ul></div>
   <div><h3 data-t="covNoT"></h3><ul class="plain" id="covNo"></ul></div>
  </div>
 </div>
</section>

<section class="band alt" id="pathways">
 <div class="wrap">
  <h2 class="reveal" data-t="pathTitle"></h2>
  <p class="lede" data-t="pathLede"></p>
  <ol class="paths reveal" id="pathlist"></ol>
 </div>
</section>

<section class="band" id="habits">
 <div class="wrap">
  <h2 class="reveal" data-t="hTitle"></h2>
  <div class="cols reveal">
   <div>
    <h3 data-t="readT"></h3>
    <ol class="steps" id="readsteps"></ol>
    <p class="meta"><span data-t="basis"></span> S. Keshav, <a href="https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf">How to Read a Paper</a></p>
   </div>
   <div>
    <h3 data-t="srcT"></h3>
    <ul class="src" id="srclist"></ul>
   </div>
   <div id="gpu">
    <h3 data-t="gpuT"></h3>
    <p class="lede" style="font-size:15px" data-t="gpuD"></p>
   </div>
  </div>
 </div>
</section>

<section class="band alt" id="expand">
 <div class="wrap">
  <h2 class="reveal" data-t="eTitle"></h2>
  <p class="lede" data-t="eLede"></p>
  <div class="grid reveal" id="layers"></div>
 </div>
</section>

<footer class="band"><div class="wrap" data-t="foot"></div></footer>

let STAGES=[];let mapDrawn=false;let C={};let FIELDS=[];let field="ai";

const LK="ai-roadmap-lang",FK="roadmap-field";let KEY="roadmap-v4:ai";
let lang="en";try{lang=localStorage.getItem(LK)||"en"}catch(e){}
let st={};
function loadProgress(){KEY="roadmap-v4:"+field;let raw=null;try{raw=localStorage.getItem(KEY);if(!raw&&field==="ai")raw=localStorage.getItem("ai-roadmap-v3")}catch(e){}try{st=JSON.parse(raw||"{}")}catch(e){st={}}}
let openSet=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>lang==="ko"?1:0;
const t=k=>T[lang][k];
let F={updated:"",weeks:[]};
const allItems=s=>s.tracks?s.tracks.flatMap(tr=>tr.items.map((_,i)=>`s${s.n}${tr.id}-${i}`)):s.items.map((_,i)=>`s${s.n}-${i}`);
const trackIds=(s,tr)=>tr.items.map((_,i)=>`s${s.n}${tr.id}-${i}`);
let total=1;
const trackDone=(s,tr)=>trackIds(s,tr).every(k=>st[k]);
const stageDone=s=>s.tracks?s.tracks.some(tr=>trackDone(s,tr)):allItems(s).every(k=>st[k]);
const curStage=()=>{const c=STAGES.findIndex(s=>!stageDone(s));return c<0?STAGES.length:c};
function renderHours(){
 const el=document.getElementById("hours");if(!STAGES.length){el.innerHTML="";return}
 const sum=a=>a.reduce((x,i)=>x+i[5],0);
 const ti=STAGES.findIndex(s=>s.tracks);
 const core=STAGES.slice(0,ti).reduce((x,s)=>x+sum(s.items),0);
 const tr=STAGES[ti].tracks.map(x=>sum(x.items));
 const res=STAGES.slice(ti+1).reduce((x,s)=>x+sum(s.items),0);
 const lo=(core+Math.min(...tr)+res)*1.5/15/52,hi=(core+Math.max(...tr)+res)*2/15/52;
 const r=x=>Math.max(0.5,Math.round(x*2)/2);
 el.innerHTML=`<h3>${t("hoursT")}</h3><div class="hgrid"><div><b>≈ ${core}h</b><span>${t("hoursCore")}</span></div><div><b>${Math.min(...tr)}–${Math.max(...tr)}h</b><span>${t("hoursTrack")}</span></div><div><b>≈ ${res}h</b><span>${t("hoursRes")}</span></div></div><p class="meta">${t("hoursNoteF")(r(lo),r(hi))}</p>`;
}
function renderPaths(){
 const P=C.pathways||[],l=L();
 document.getElementById("pathways").style.display=P.length?"":"none";
 document.getElementById("pathlist").innerHTML=P.slice().sort((a,b)=>a[2]-b[2]).map(p=>`<li><span class="when">${esc(t("fromStage")(p[2]))}</span><div><h3>${(()=>{const nm=Array.isArray(p[0])?p[0][l]:p[0];return p[1]?`<a href="${esc(p[1])}">${esc(nm)}</a>`:esc(nm)})()}</h3><p>${esc(p[3+l])}</p><p class="note">${esc(p[5+l])}</p></div></li>`).join("");
}
function renderTabs(){
 document.getElementById("fieldtabs").innerHTML=FIELDS.map(f=>`<button type="button" role="tab" data-f="${esc(f.id)}" aria-selected="${f.id===field}">${esc(f.name[L()])}</button>`).join("");
 {const ft=document.getElementById("fieldtabs"),sel=ft.querySelector("[aria-selected=true]");if(sel)ft.scrollLeft=sel.offsetLeft-ft.clientWidth/2+sel.offsetWidth/2;}
}
function renderStatic(){
 document.documentElement.lang=lang;
 const l=L();document.title=C.title?C.title[l]:"Research Roadmap";
 document.getElementById("title").textContent=C.title?C.title[l]:"";
 document.getElementById("lede").textContent=C.lede?C.lede[l]:"";
 document.getElementById("status").textContent=C.status?C.status[l]:"";document.getElementById("status").style.display=C.status?"":"none";
 renderTabs();renderPaths();
 document.getElementById("gpu").style.display=field==="ai"?"":"none";
 for(const el of document.querySelectorAll("[data-t]"))el.textContent=t(el.dataset.t);
 for(const b of document.querySelectorAll(".lang button"))b.setAttribute("aria-pressed",b.dataset.lang===lang);
 document.getElementById("map").setAttribute("aria-label",t("mapLabel"));
 document.getElementById("upd").textContent=F.updated?t("upd")+F.updated:"";
 document.getElementById("readsteps").innerHTML=t("read").map(x=>`<li>${esc(x)}</li>`).join("");
 document.getElementById("srclist").innerHTML=(C.sources||[]).map(s=>`<li><a href="${esc(s[1])}">${esc(s[0])}</a><span class="d">${esc(s[2+L()])}</span></li>`).join("");
 document.getElementById("covYes").innerHTML=((C.coverage||{}).yes||[]).map(x=>`<li>${esc(x[l])}</li>`).join("");
 document.getElementById("covNo").innerHTML=((C.coverage||{}).no||[]).map(x=>`<li>${esc(x[l])}</li>`).join("");
 renderHours();
 document.getElementById("layers").innerHTML=t("layers").map((x,i)=>`<div class="card"><span><span class="tag${i===3?" p":""}">${esc(x[0])}</span></span><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p></div>`).join("");
}

function renderFrontier(){
 const sl=n=>n?t("stageN")(n):t("stageAny");
 const card=it=>`<div class="card"><span><span class="tag p">${esc(it["type_"+lang]||it.type_en||it.type||"")}</span><span class="tag">${esc(typeof it.stage==="number"?sl(it.stage):(it.stage||""))}</span></span><h3><a href="${esc(it.url)}">${esc(it.title)}</a></h3><p>${esc(it["why_"+lang]||it.why_en||it.why||"")}</p></div>`;
 const wk=F.weeks[0];
 document.getElementById("fnote").textContent=wk?(wk["note_"+lang]||wk.note_en||wk.note||""):"";
 document.getElementById("fgrid").innerHTML=wk?wk.items.map(card).join(""):"";
 const old=F.weeks.slice(1);
 document.getElementById("farch").style.display=old.length?"":"none";
 document.getElementById("fold").innerHTML=old.map(w=>`<h3 style="margin-top:20px">${esc(w.week)}</h3><div class="grid" style="margin-top:10px;margin-bottom:14px">${w.items.map(card).join("")}</div>`).join("");
}

const box=document.getElementById("stages");
function itemsHTML(s,ids,list){const l=L();return `<ul class="items">${list.map((it,i)=>{const id=ids[i],u=(l&&it[8])?it[8]:it[1];return `<li data-id="${id}"${st[id]?' class="chk"':""}><input type="checkbox" id="${id}"${st[id]?" checked":""} aria-label="${esc(it[0])}"><span class="it"><a href="${esc(u)}">${esc(it[0])}</a><span class="sub">${esc(t("kind")[it[2]])} · ${esc(it[3+l])}</span><span class="d">${esc(it[6+l])}</span></span><span class="hrs">≈ ${it[5]}h</span></li>`}).join("")}</ul>`}
function blockHTML(o,s,ids){const l=L();return `<h4>${t("concepts")}</h4><ul class="chips">${o.concepts[l].map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
<h4>${t("res")}</h4>${itemsHTML(s,ids,o.items)}
<div class="two"><div class="box"><b>${t("proj")}</b>${esc(o.proj[l])}</div><div class="box"><b>${t("exit")}</b>${esc(o.exit[l])}</div></div>
<div class="box"><b>${t("pit")}</b><ul>${o.pit.map(p=>`<li>${esc(p[l])}</li>`).join("")}</ul></div>`}
function renderStages(){
 const l=L(),cur=curStage();
 if(!openSet)openSet=new Set([String(Math.min(cur,STAGES.length-1))]);
 box.innerHTML=STAGES.map(s=>{
  const ids=allItems(s),n=ids.filter(k=>st[k]).length;
  const head=`<div class="facts"><span><b>${t("dur")}</b>${esc(s.dur[l])}</span><span><b>${t("pre")}</b>${esc(s.pre[l])}</span></div><p class="why">${esc(s.why[l])}</p>`;
  const body=s.tracks?`<h4>${t("pick")}</h4><div class="tracks">${s.tracks.map(tr=>{const tids=trackIds(s,tr),tn=tids.filter(k=>st[k]).length,key=s.n+tr.id;return `<details class="track${trackDone(s,tr)?" done":""}" data-k="${key}"${openSet.has(key)?" open":""}><summary><span class="tid">${tr.id}</span><span class="sumtxt"><h3>${esc(tr.name[l])}</h3><p>${esc(tr.goal[l])}</p></span><span class="cnt">${tn}/${tids.length}</span></summary><div class="tbody">${blockHTML(tr,s,tids)}</div></details>`}).join("")}</div>`:blockHTML(s,s,ids);
  const shown=s.tracks?`${s.tracks.filter(tr=>trackDone(s,tr)).length}/${s.tracks.length} ${t("tracksDone")}`:`${n}/${ids.length}`;
  return `<details class="stage${stageDone(s)?" done":""}" data-k="${s.n}"${openSet.has(String(s.n))?" open":""}>
<summary><span class="num">${s.n}</span><span class="sumtxt"><h3>${esc(s.name[l])}</h3><p>${esc(s.goal[l])}</p></span><span class="cnt">${shown}</span></summary>
<div class="body">${head}${body}</div></details>`}).join("");
 const done=Object.keys(st).filter(k=>st[k]).length;
 document.getElementById("pbar").style.width=(Math.min(done,total)/total*100)+"%";
 document.getElementById("ptext").textContent=lang==="ko"?`${t("done")} ${done} / ${total}${t("items")}`:`${done} ${t("of")} ${total} ${t("items")} ${t("done").toLowerCase()}`;
 setExpandLabel();
}
const allKeys=()=>STAGES.flatMap(s=>[String(s.n)].concat(s.tracks?s.tracks.map(tr=>s.n+tr.id):[]));
function setExpandLabel(){document.getElementById("expand-all").textContent=STAGES.every(s=>openSet.has(String(s.n)))?t("collapseAll"):t("expandAll")}
box.addEventListener("toggle",e=>{const d=e.target;if(!d.matches||!d.matches("details[data-k]"))return;d.open?openSet.add(d.dataset.k):openSet.delete(d.dataset.k);setExpandLabel()},true);
box.addEventListener("change",e=>{const li=e.target.closest("li[data-id]");if(!li)return;if(e.target.checked)st[li.dataset.id]=true;else delete st[li.dataset.id];save();renderStages();drawMap()});
document.getElementById("share").addEventListener("click",()=>{const url=location.origin+location.pathname+"#f-"+field+"~"+encodeProgress();const msg=document.getElementById("sharemsg");
 const done=()=>{msg.textContent=t("shared")};const fail=()=>{msg.textContent=t("shareFail")+" "+url};
 try{navigator.clipboard.writeText(url).then(done,fail)}catch(e){fail()}});
document.getElementById("reset").addEventListener("click",()=>{st={};save();renderStages();drawMap()});
document.getElementById("expand-all").addEventListener("click",()=>{const allOpen=STAGES.every(s=>openSet.has(String(s.n)));openSet=new Set(allOpen?[]:STAGES.map(s=>String(s.n)));renderStages()});
for(const b of document.querySelectorAll(".lang button"))b.addEventListener("click",()=>{if(lang===b.dataset.lang)return;lang=b.dataset.lang;try{localStorage.setItem(LK,lang)}catch(e){}document.body.classList.add("switching");setTimeout(()=>{renderAll();requestAnimationFrame(()=>document.body.classList.remove("switching"))},120)});

const svg=document.getElementById("map");
function drawMap(){
 const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H||!STAGES.length)return;
 const l=L(),names=STAGES.map(s=>s.short[l]).concat([t("frontier")]);
 const n=names.length,narrow=W<600,at=curStage();
 const gap=(W-16)/(n-1);
 const est=s=>[...s].reduce((a,c)=>a+(c.charCodeAt(0)>0x2fff?14:7.6),0);
 const full=names.map((x,i)=>i===n-1?x:`${i} ${x}`);
 const fits=narrow||full.every((x,i)=>{const w=est(x);return (i===0||i===n-1)?w<gap*0.95:w<gap-14});
 const pts=names.map((_,i)=>narrow?[8,16+i*(H-32)/(n-1)]:[8+i*gap,H*0.42]);
 const seg=(a,b)=>pts.slice(a,b).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
 const ff="Inter, Noto Sans KR, sans-serif";
 const A=!mapDrawn;let g=`<path d="${seg(0,n)}" fill="none" stroke-width="1.5" style="${A?"--len:1000;":""}stroke:var(--line)"${A?` class="route" pathLength="1000"`:""}/>`;
 if(at>0)g+=`<path d="${seg(0,Math.min(at,n-1)+1)}" fill="none" stroke-width="1.5" style="${A?"--len:1000;":""}stroke:var(--acc)"${A?` class="route" pathLength="1000"`:""}/>`;
 g+=pts.map((p,i)=>{
  const here=i===at,past=i<at,last=i===n-1;
  const sty=here||past?"fill:var(--acc);stroke:var(--acc)":"fill:var(--bg);stroke:var(--mute)";
  const label=fits?full[i]:(last?"★":String(i));
  const lx=narrow?p[0]+22:p[0],ly=narrow?p[1]+5:p[1]+34;
  const anchor=narrow?"start":(i===0?"start":last?"end":"middle");
  return (here?`<circle cx="${p[0]}" cy="${p[1]}" r="12" style="fill:none;stroke:var(--acc);opacity:.35" stroke-width="1"/>`:"")+
   `<g${A?` class="stop" style="animation-delay:${(0.15+1.2*i/(n-1)).toFixed(2)}s"`:""}><circle cx="${p[0]}" cy="${p[1]}" r="${here?6:4}" style="${sty}" stroke-width="1.5"/>`+
   `<text x="${lx}" y="${ly}" text-anchor="${anchor}" style="fill:${here?"var(--ink)":"var(--mute)"}" font-size="14" font-weight="${here?600:400}" font-family="${ff}">${esc(label)}${here&&narrow?` <tspan style="fill:var(--acc)" font-size="12" font-weight="400">· ${t("now")}</tspan>`:""}</text>`+
   (here&&!narrow?`<text x="${lx}" y="${p[1]-22}" text-anchor="${anchor}" style="fill:var(--acc)" font-size="12" font-family="${ff}">${t("now")}${fits?"":" · "+esc(full[i])}</text>`:"")+`</g>`;
 }).join("");
 svg.innerHTML=g;mapDrawn=true;
}
const ro=new ResizeObserver(drawMap);ro.observe(svg);
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}},{rootMargin:"0px 0px -8% 0px"}):null;
for(const el of document.querySelectorAll(".reveal"))io?io.observe(el):el.classList.add("in");
function renderAll(){renderStatic();renderFrontier();renderStages();drawMap()}
function fieldFromHash(){const m=location.hash.match(/^#f-([a-z0-9-]+)(?:~[A-Za-z0-9_-]*)?$/);return m?m[1]:null}
function codeFromHash(){const m=location.hash.match(/^#f-[a-z0-9-]+~([A-Za-z0-9_-]+)$/);return m?m[1]:null}
function encodeProgress(){const keys=Object.keys(st).filter(k=>st[k]);return btoa(unescape(encodeURIComponent(keys.join(",")))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decodeProgress(c){try{const s=decodeURIComponent(escape(atob(c.replace(/-/g,"+").replace(/_/g,"/"))));return s?s.split(","):[]}catch(e){return []}}
let pendingCode=null;
function loadField(id,push){
 const f=FIELDS.find(x=>x.id===id)||FIELDS[0];field=f.id;try{localStorage.setItem(FK,field)}catch(e){}
 if(push&&location.hash!=="#f-"+field)history.replaceState(null,"","#f-"+field);
 loadProgress();if(pendingCode){for(const k of decodeProgress(pendingCode))st[k]=true;save();pendingCode=null;setTimeout(()=>{document.getElementById("sharemsg").textContent=t("imported")},400);history.replaceState(null,"","#f-"+field)}openSet=null;mapDrawn=false;
 document.body.classList.add("switching");
 return Promise.all([fetch(f.curriculum).then(r=>r.json()),fetch(f.frontier).then(r=>r.json()).catch(()=>({updated:"",weeks:[]}))])
  .then(([c,fr])=>{C=c;STAGES=c.stages;F=fr;total=STAGES.reduce((a,s)=>a+allItems(s).length,0)||1;renderAll();requestAnimationFrame(()=>document.body.classList.remove("switching"))})
  .catch(()=>{document.body.classList.remove("switching");document.getElementById("stages").innerHTML='<p class="lede">Could not load '+esc(f.curriculum)+'.</p>'});
}
document.getElementById("fieldtabs").addEventListener("click",e=>{const b=e.target.closest("button[data-f]");if(!b||b.dataset.f===field)return;loadField(b.dataset.f,true)});
window.addEventListener("hashchange",()=>{const h=fieldFromHash();if(h&&h!==field)loadField(h,false)});
renderStatic();
fetch("data/fields.json").then(r=>r.json()).then(j=>{FIELDS=j.fields;pendingCode=codeFromHash();let start=fieldFromHash();if(!start){try{start=localStorage.getItem(FK)}catch(e){}}loadField(start||"ai",false)})
 .catch(()=>{document.getElementById("stages").innerHTML='<p class="lede">Could not load data/fields.json.</p>'});
}
</script>
</body>
</html>
